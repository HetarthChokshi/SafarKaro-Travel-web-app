version: '3.9'

services:
  backend:
    build:
      context: ./safarBackend
      dockerfile: docker/local/Dockerfile
    container_name: safarkaro-backend
    env_file:
      - ./safarBackend/docker/local/.env.example
    ports:
      - "8000:8000"
    volumes:
      - ./safarBackend:/app
    networks:
      - safarkaro-net
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ./safarkaroapp
      dockerfile: Dockerfile
    container_name: safarkaro-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: "http://backend:8000/"
    volumes:
      - ./safarkaroapp:/app
      - /app/node_modules
    networks:
      - safarkaro-net
    command: npm start

networks:
  safarkaro-net:
    driver: bridge
